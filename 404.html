<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><title>ไม่พบหน้านี้ — ตุ๊กตา</title>
<script>
  // Turn pretty paths (e.g. /p/my-post) into hash routes.
  var p = location.pathname.replace(/\/+$/, "");
  location.replace("/#" + (p || "/") + location.search);
</script></head><body></body></html>
